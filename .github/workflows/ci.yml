name: "Airbnb CI Pipeline / Workflow"

on:
    push:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: "Setup Node JS"
              uses: actions/setup-node@v4
              with:
                node-version: "16"

            - name: "Check node version"
              run: node --version

            - name: "Clone the repository"
              uses: actions/checkout@v2

            - name: "Install auth service dependencies"
              working-directory: ./auth-service
              run: npm install

            - name: "Install booking service dependencies"
              working-directory: ./booking-service
              run: npm install

            - name: "Install frontend dependencies"
              working-directory: ./frontend
              run: npm install

            - name: "Install hotel service dependencies"
              working-directory: ./hotel-service
              run: npm install

            - name: "Install notification service dependencies"
              working-directory: ./notification-service
              run: npm install

            - name: "List directories"
              run: ls

            - name: "Run auth service build"
              working-directory: ./auth-service
              run: npm run build

            - name: "Run booking service build"
              working-directory: ./booking-service
              run: npm run build

            - name: "Run frontend build"
              working-directory: ./frontend
              run: npm run build

            - name: "Run hotel service build"
              working-directory: ./hotel-service
              run: npm run build

            - name: "Run notification service build"
              working-directory: ./notification-service
              run: npm run build